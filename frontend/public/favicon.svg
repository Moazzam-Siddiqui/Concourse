<!--
  Concourse mark.

  A concourse is a ring corridor with openings, so the mark is one: a thick arc broken on
  the right, with a dot held in the mouth of the break — someone at the gate. It doubles
  as the initial.

  Olive, the accent. One filled silhouette rather than strokes,
  because this file is read at 16px where stroked detail smears into a block.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Concourse">
  <defs>
    <mask id="cfMarkCut">
      <rect width="64" height="64" rx="15" fill="#fff"/>
      <path d="M40.2 20.2 A15 15 0 1 0 40.2 43.8" fill="none" stroke="#000"
        stroke-width="10" stroke-linecap="round"/>
      <circle cx="48" cy="32" r="4.5" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="#5F6B39" mask="url(#cfMarkCut)"/>
</svg>
