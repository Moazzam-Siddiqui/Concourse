<!--
  Concourse mark.

  Three swept channels narrowing left-to-right: the crowd funnelling through a gate, drawn
  like an F1 chicane. The top channel stays clear (blue), the middle warms (orange) and the
  bottom one jams (red) — the density ramp used across the app, so the logo carries the
  product's core idea. The apex dot is the bottleneck the system predicts.

  Sized for a favicon first: heavy 9px strokes on a 64 grid so the three channels stay
  distinguishable at 16px, where thin strokes would smear into one block.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Concourse">
  <defs>
    <linearGradient id="cfEmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E10600"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#0B1018"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="url(#cfEmber)" stroke-opacity=".55" stroke-width="1.5"/>

  <g fill="none" stroke-width="9" stroke-linecap="round">
    <path d="M13 17 H35" stroke="#4D8DF0"/>
    <path d="M13 32 H44" stroke="#FF6A00"/>
    <path d="M13 47 H29" stroke="#E10600"/>
  </g>

  <circle cx="50" cy="32" r="5.5" fill="#EEF2F8"/>
</svg>
