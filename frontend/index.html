<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simulate the venue, predict the bottleneck, route around it — before the queue becomes a crush." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#5F6B39" />
    <meta name="theme-color" content="#F7F4EE" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:title" content="Concourse" />
    <meta property="og:description" content="Simulate the venue, predict the bottleneck, route around it — before the queue becomes a crush." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are requested here rather than @imported from the app's style block. An @import
         inside CSS is only discovered once that CSS has been fetched and parsed, so the font
         request started a round trip late and the first paint landed on the fallback face.
         As a <link> in the head the browser's preload scanner finds it while still parsing
         this document, alongside the preconnects that warm the two hosts it needs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Shadows+Into+Light&family=IBM+Plex+Mono:wght@400;500&display=swap" />

    <title>Concourse — see the crush before it forms</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
